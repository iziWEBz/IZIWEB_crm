# Production nginx for compose.coolify.yaml. Serves public/ (baked into the
# image) and passes PHP to the `api` service over FastCGI.
server {
    listen 80;
    server_name _;
    root /app/public;
    index index.php;
    client_max_body_size 20m;

    # Docker's DNS; re-resolving `api` means a redeployed api container is
    # picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream api:9000;

    location = /up {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
